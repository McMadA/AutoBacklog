# AutoBacklog Configuration: GitHub Issues
project_name: "OpenSourceApp"
system_prompt_intro: "You are an autonomous Senior Software Engineer."
max_rounds: 500
cooldown_seconds: 10

backlog:
  type: "github_issues"
  repo: "owner/repo" # or leave blank to auto-detect from git remote
  execution_order: []
  non_executable_ids: []
  include_ideas: false

provider:
  type: "auto" # 'auto', 'agy', or 'claude'
  large_model: "claude-3-7-sonnet"
  small_model: "claude-3-5-haiku"

safeguards:
  create_snapshots: true
  snapshots_dir: "_snapshots"
  auto_revert_zero_diff: true

reporters:
  dashboard_file: "RUN_SUMMARY.md"
  stream_console: true
